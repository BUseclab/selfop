[project]
name = "selfop"
version = "0.1.0"
description = "SelfOp: an optimization algorithm for self-improving security agents"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "docker",
    "httpx",
    "nest-asyncio",
    "openai",
    "pydantic",
    "python-dotenv",
    "tqdm",
]

[project.optional-dependencies]
cybergym = ["cybergym"]

[project.scripts]
selfop = "selfop.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["selfop", "tasks"]
